# Minimal single-binary Tempo: OTLP in, local disk storage. Demo-sized on purpose —
# retention and object storage are production concerns the README's docs already own.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
