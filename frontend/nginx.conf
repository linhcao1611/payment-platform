server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # In dev, Vite proxies /api to the API. In the container that job is nginx's, so the
    # built app keeps calling the same relative /api paths and needs no build-time config.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handy for a reviewer: the API's own surfaces, reachable from the same origin.
    location /swagger/ {
        proxy_pass http://api:8080/swagger/;
        proxy_set_header Host $host;
    }

    location = /metrics {
        proxy_pass http://api:8080/metrics;
        proxy_set_header Host $host;
    }

    # The dashboard routes client-side (/payments/{id}), so any unknown path must return the
    # app rather than a 404 — otherwise refreshing a detail page breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
