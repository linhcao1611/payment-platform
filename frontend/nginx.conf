server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A literal hostname in proxy_pass is resolved ONCE, at startup, and cached forever —
    # so the first time the api container is recreated (up -d --build after a code change)
    # nginx keeps dialing the old IP and every request 502s until nginx itself restarts.
    # Putting the upstream in a variable forces per-request resolution through Docker's
    # embedded DNS, honouring the TTL below, so a rebuilt api is picked up within seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # In dev, Vite proxies /api to the API. In the container that job is nginx's, so the
    # built app keeps calling the same relative /api paths and needs no build-time config.
    # With a variable proxy_pass nginx forwards the original URI untouched, which is exactly
    # what these locations want: /api/..., /swagger/... and /metrics map to themselves.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handy for a reviewer: the API's own surfaces, reachable from the same origin.
    location /swagger/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location = /metrics {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # The dashboard routes client-side (/payments/{id}), so any unknown path must return the
    # app rather than a 404 — otherwise refreshing a detail page breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
