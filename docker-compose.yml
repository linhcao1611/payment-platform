# Two ways to run this:
#
#   docker compose up -d                      Postgres only — the inner dev loop, where the API
#                                             and dashboard run on the host with hot reload.
#   docker compose --profile demo up --build  The whole stack. Nothing needed on the host but
#                                             Docker: no .NET SDK, no Node.
#
# The `demo` profile is what makes both work from one file: services carrying a profile stay
# out of a plain `up`, so adding the demo path costs the dev workflow nothing.

services:
  postgres:
    image: postgres:16-alpine
    container_name: payments-postgres
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments_dev # local dev only — never a real secret
      POSTGRES_DB: payments
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [demo]
    build: ./backend
    container_name: payments-api
    environment:
      # Inside the compose network Postgres is `postgres:5432`; the 5433 mapping above is only
      # for host tools.
      ConnectionStrings__Payments: "Host=postgres;Port=5432;Database=payments;Username=payments;Password=payments_dev"
      ASPNETCORE_URLS: "http://+:8080"
      # Development on purpose, for the demo's sake: it applies migrations on startup and
      # serves Swagger, so a reviewer gets a working, explorable API from one command. The
      # README is explicit that production runs migrations as a gated deploy step instead.
      ASPNETCORE_ENVIRONMENT: Development
      # The gateway's random declines make the failure paths demonstrable but a scripted demo
      # unpredictable. Settlement still fails 20% of the time so retries and backoff are
      # visible in the logs; authorization always approves so a walkthrough doesn't get a
      # surprise decline. Override either at `up` time to show the other path.
      FakeGateway__AuthorizeDeclineRate: "0"
      # Create is API-only — the dashboard has no "new payment" form — so without this a
      # reviewer's first view is an empty table they can't populate. Seeds a week of plausible
      # history (several payments left Authorized, so there's something to press Capture on)
      # once, only into an empty database.
      Demo__Seed: "true"
      Demo__Days: "7"
      Demo__PaymentsPerDay: "70"
      # Real traffic against ourselves, so /metrics and the Grafana dashboards show something
      # true. Seeded history can't move the counters — they live in the request path and count
      # what actually happened — and backfilling invented numbers would make every graph
      # unfalsifiable. So the demo earns its data instead. Set Enabled=false for a still table.
      DemoTraffic__Enabled: "true"
      DemoTraffic__PaymentsPerMinute: "10"
      # Lights the tracing seam. In a demo-only run (no observability profile) Tempo doesn't
      # exist and the exporter drops its batches quietly — telemetry is best-effort by
      # definition, and the app must never fail because a collector is away. The dev loop
      # leaves this unset, and the seam stays dormant.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Liveness only, matching what /healthz means: the process is up. Readiness (/readyz)
      # checks Postgres, which depends_on already guarantees here.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    profiles: [demo]
    build: ./frontend
    container_name: payments-dashboard
    ports:
      # Same port as `npm run dev`, so the docs only ever name one address for the dashboard.
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  # --- Observability (optional) -------------------------------------------------------
  # `docker compose --profile demo --profile observability up --build`
  #
  # The API is untouched by any of this. It writes JSON to stdout and exposes /metrics; Alloy
  # collects the logs and Prometheus scrapes the metrics. That is the point the README makes
  # about seams: pointing a real stack at this app is config, not code.

  loki:
    profiles: [observability]
    image: grafana/loki:3.4.2
    container_name: payments-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      # Same reason as Prometheus: keep the logs across a restart.
      - lokidata:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.8.1
    container_name: payments-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only, and only to discover containers and read their stdout. Nothing here writes.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.8.1
    container_name: payments-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./ops/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.3.0
    container_name: payments-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 15 days, and on a volume: without persistence every `compose restart` silently threw
      # away the history, so the graphs only ever covered the minutes since the last restart.
      # Metrics still only cover live traffic — the seeded week is in Postgres, not here — but
      # at least a demo now survives restarting the API.
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.6.0
    container_name: payments-grafana
    environment:
      # Anonymous admin: this is a local demo, and making a reviewer hunt for a password before
      # they can see whether the observability works would defeat the purpose. Never do this
      # anywhere real.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      # Land straight on the dashboard rather than Grafana's welcome page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payments.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
  promdata:
  lokidata:
  tempodata:
